[project]
name = "resource-availability-monitoring"
version = "0.0.0"
description = "A simple resource monitoring tool, that can be used to test availability of HTCondor resources."
authors = [{name = "Sebastian Brommer", email = "brommer.sebastian@gmail.com"}]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Clustering",
    "Topic :: System :: Distributed Computing",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "htcondor>=23.4.0",
    "PyYAML>=6.0.1",
    "schedule>=1.2.1",
    "influxdb-client>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.2.0",
]

[project.scripts]
ram-cli = "resource_availability_monitoring.__main__:main_cli"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "resource_availability_monitoring/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["resource_availability_monitoring"]